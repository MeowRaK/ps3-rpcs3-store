name: Build PS3 catalog
on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 0"
  push:
    paths:
      - "build_catalog.py"
      - ".github/workflows/update-ps3-catalog.yml"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Convert PS3 NoPayStation database to FPKGi+ download lists
        run: python build_catalog.py --output .
      - name: Validate outputs
        run: |
          python -m json.tool GAMES.json > /dev/null
          python -m json.tool DEMOS.json > /dev/null
          python -c 'import json; d=json.load(open("DEMOS.json")); assert len(d["DATA"]) > 0'
      - name: Commit updated catalogs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add GAMES.json DEMOS.json PS3_LIBRARY.json catalog_report.json
          git diff --staged --quiet || (git commit -m "Update PS3 catalog" && git push)
