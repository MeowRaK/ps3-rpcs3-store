name: Build PS3 catalog
on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 0'
  push:
    paths:
      - 'build_catalog.py'
      - 'enhance_catalog.py'
      - '.github/workflows/update-ps3-catalog.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build PS3 digital download catalog
        run: python build_catalog.py --output .
      - name: Add disc metadata and filter non-English-only editions
        run: python enhance_catalog.py --output .
      - name: Validate outputs
        run: |
          python -m json.tool GAMES.json > /dev/null
          python -m json.tool DEMOS.json > /dev/null
          python -m json.tool PS3_LIBRARY.json > /dev/null
          python -m json.tool language_filter_report.json > /dev/null
          python - <<'PY'
          import json
          catalog = json.load(open('DEMOS.json', encoding='utf-8'))['DATA']
          library = json.load(open('PS3_LIBRARY.json', encoding='utf-8'))
          assert len(catalog) > 100, 'Unusually empty catalog'
          assert any(x.get('title_id') == 'BLUS30481' and x.get('name','').casefold() == 'nier' for x in library), 'English NieR disc entry missing'
          assert all(x.get('title_id') != 'NPEB01205' for x in catalog.values()), 'German BO2 edition still present'
          print(f'Validation passed: {len(catalog)} downloadable entries, {len(library)} library entries')
          PY
      - name: Commit updated catalogs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add GAMES.json DEMOS.json PS3_LIBRARY.json catalog_report.json PS3_LANGUAGE_EXCLUDED.json language_filter_report.json
          git diff --staged --quiet || (git commit -m 'Update PS3 catalog, add disc-only titles and filter non-English releases' && git push)
